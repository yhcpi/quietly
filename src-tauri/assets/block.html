<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site blocked — Quietly</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 sans-serif;
    background: #F5F3EF;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 48px;
    max-width: 480px;
    box-shadow: 0 4px 24px rgba(61, 90, 254, 0.08);
    text-align: center;
  }
  .badge {
    display: inline-block;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #3D5AFE;
    color: #fff;
    font-size: 24px;
    line-height: 48px;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 600;
  }
  p {
    margin: 0 0 24px;
    color: #5C6BC0;
    line-height: 1.5;
  }
  .meta {
    font-size: 13px;
    color: #888;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">·</div>
    <h1>This site is blocked</h1>
    <p>You are in a focus session. Distracting sites are paused until your break.</p>
    <div class="meta">Quietly</div>
  </div>
</body>
</html>
