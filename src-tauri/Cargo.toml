[package]
name = "quietly"
version = "0.1.0"
description = "A Windows desktop focus / productivity app that blocks distracting sites and apps via a local forward proxy"
authors = ["Quietly Dev"]
edition = "2021"
license = "MIT"
repository = "https://github.com/yhcpi/quietly"
homepage = "https://github.com/yhcpi/quietly"
keywords = ["focus", "productivity", "tauri", "windows", "proxy"]
categories = ["productivity"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quietly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
once_cell = "1.19"
anyhow = "1.0"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "net", "io-util"] }
regex = "1.10"
winreg = "0.55"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_Networking_WinInet",
] }

[dev-dependencies]
tempfile = "3.10"
